name: nova_home_admin
description: NOVA HOME administration app for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nova_core:
    path: ../../packages/nova_core
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  fl_chart: ^0.70.2
  cross_file: ^0.3.4+2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  app_links: ^6.4.1
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
