name: nova-home-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nova_home
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_dev_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_home"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_dev_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD:-nova_dev_password}@db:5432/nova_home
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./backend:/app
      - ./backend/receipts:/app/receipts
      - ./backend/media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:8000
      NUXT_API_INTERNAL_BASE: http://api:8000
      NUXT_PUBLIC_BRAND_NAME: NOVA HOME
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_dev_data:
  redis_dev_data:
  frontend_node_modules:
