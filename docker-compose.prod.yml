name: nova-home-prod
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova_home
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
    volumes: ["postgres_prod_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_home"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: ["redis_prod_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD}@db:5432/nova_home
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      COOKIE_SECURE: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3 --proxy-headers --forwarded-allow-ips=*"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes: ["receipts_prod:/app/receipts", "media_prod:/app/media"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private, edge]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NUXT_API_INTERNAL_BASE: http://api:8000
      NUXT_PUBLIC_BRAND_NAME: NOVA HOME
    expose: ["3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, api]
    networks: [edge]
networks:
  edge:
  private:
    internal: true
volumes:
  postgres_prod_data:
  redis_prod_data:
  receipts_prod:
  media_prod:
